<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-6">

      <div class="d-flex align-items-center gap-3 mb-4">
        <button class="btn btn-outline-dark rounded-circle" style="width:38px;height:38px;" routerLink="/profile">
          <i class="bi bi-arrow-left"></i>
        </button>
        <h4 class="fw-bold mb-0">Settings</h4>
      </div>

      <div class="card border-0 shadow-sm rounded-4 p-4 bg-white border-top border-danger border-4">
        <h5 class="fw-bold mb-4 d-flex align-items-center">
          <i class="bi bi-person-gear me-2 text-danger"></i> Profile Settings
        </h5>

        <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label class="form-label small fw-bold text-muted">First Name</label>
            <input type="text" formControlName="firstName" class="form-control form-control-lg bg-light border-0 rounded-3">
          </div>
          <div class="mb-3">
            <label class="form-label small fw-bold text-muted">Last Name</label>
            <input type="text" formControlName="lastName" class="form-control form-control-lg bg-light border-0 rounded-3">
          </div>
          <div class="mb-3">
            <label class="form-label small fw-bold text-muted">Email (Read-only)</label>
            <input type="email" formControlName="email" class="form-control form-control-lg bg-white border-0 text-muted" readonly style="font-size: 0.9rem;">
          </div>
          <div class="mb-4">
            <label class="form-label small fw-bold text-muted">Phone Number</label>
            <app-phone-input formControlName="phoneNumber"></app-phone-input>
          </div>

          @if (userData()?.userType === 1) {
            <hr class="my-4 text-muted">
            <h6 class="fw-bold text-danger mb-3">Professional Bio</h6>

            <div class="mb-3">
              <label class="form-label small fw-bold text-muted">Job Title</label>
              <input type="text" formControlName="brokerTitle" class="form-control form-control-lg bg-light border-0 rounded-3">
            </div>

            <div class="mb-4">
              <label class="form-label small fw-bold text-muted">Description / Bio</label>
              <textarea formControlName="brokerDescription" class="form-control form-control-lg bg-light border-0 rounded-3" rows="4"></textarea>
            </div>
          }
          <div class="d-grid">
            <button type="submit" [disabled]="profileForm.invalid" class="btn btn-danger btn-lg rounded-pill fw-bold shadow-sm">
               Save Changes
            </button>
          </div>
        </form>
      </div>

    </div>
  </div>
</div>
