<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm py-2 px-md-4" dir="ltr">
  <div class="container-fluid">
    
    <!-- لوجو الـ CRM -->
    <a class="navbar-brand fw-bold d-flex align-items-center" routerLink="/crm/dashboard">
      <i class="bi bi-graph-up-arrow text-danger me-2 fs-3"></i>
      <span class="fs-4">BETK <span class="text-danger">CRM</span></span>
    </a>

    <div class="d-flex align-items-center gap-2 gap-md-4 ms-auto">
      
      <!-- زرار العودة للموقع الأصلي -->
     <a href="javascript:void(0)" 
   (click)="goToMainWebsite()" 
   class="btn btn-outline-light btn-sm rounded-pill fw-bold px-2 px-md-4 py-1 py-md-2 d-flex align-items-center"
   title="Main Website">
  <i class="bi bi-globe"></i> 
  <span class="ms-1 d-none d-md-inline">Main Website</span>
</a>

      <!-- الإشعارات (Notifications Bell) -->
      <div class="dropdown mt-1" *ngIf="!isAdmin()">
        <a class="nav-link text-white position-relative d-flex align-items-center" href="#" role="button" data-bs-toggle="dropdown" style="cursor: pointer;">
          <i class="bi bi-bell-fill fs-4"></i> 
          <span *ngIf="(todayCount() + lateCount() + tooLateCount()) > 0" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger shadow-sm" style="font-size: 0.7rem;">
            {{ todayCount() + lateCount() + tooLateCount() }}
          </span>
        </a>
        
        <ul class="dropdown-menu dropdown-menu-end shadow-lg border-0 p-2" style="width: 280px;">
          <li><h6 class="dropdown-header fw-bold text-danger border-bottom pb-2 mb-2 fs-6">
            <i class="bi bi-clock-history me-1"></i> Reminders
          </h6></li>

          <li *ngIf="(todayCount() + lateCount() + tooLateCount()) === 0">
            <span class="dropdown-item text-muted small py-3 text-center">No pending reminders. Relax! 🎉</span>
          </li>

          <!-- 🟢 الـ 3 Categories - كل واحدة بتفتح ليستة العملاء اللي جواها -->
          <li>
            <a class="dropdown-item d-flex justify-content-between align-items-center rounded py-2 mb-1" [routerLink]="['/crm/notifications/today']">
              <span class="fw-bold"><i class="bi bi-calendar-check text-primary me-2"></i> Today</span>
              <span class="badge bg-primary rounded-pill">{{ todayCount() }}</span>
            </a>
          </li>
          <li>
            <a class="dropdown-item d-flex justify-content-between align-items-center rounded py-2 mb-1" [routerLink]="['/crm/notifications/late']">
              <span class="fw-bold"><i class="bi bi-exclamation-circle text-warning me-2"></i> Late</span>
              <span class="badge bg-warning text-dark rounded-pill">{{ lateCount() }}</span>
            </a>
          </li>
          <li>
            <a class="dropdown-item d-flex justify-content-between align-items-center rounded py-2" [routerLink]="['/crm/notifications/too-late']">
              <span class="fw-bold"><i class="bi bi-exclamation-triangle-fill text-danger me-2"></i> Too Late</span>
              <span class="badge bg-danger rounded-pill">{{ tooLateCount() }}</span>
            </a>
          </li>
        </ul>
      </div>

      <!-- خط فاصل شيك بين الإشعارات والبروفايل -->
      <div class="vr text-white opacity-25 d-none d-md-block" style="width: 2px; height: 35px;"></div>

      <a routerLink="/crm/profile" class="text-white text-decoration-none d-flex align-items-center gap-2" title="My Profile" style="cursor: pointer;">
        <img [src]="brokerImage()" class="rounded-circle shadow-sm" style="width: 42px; height: 42px; object-fit: cover;">
        <span class="fw-bold d-none d-md-block fs-6">{{ brokerName() }}</span>
      </a>

      <!-- زرار تسجيل الخروج -->
      <a href="javascript:void(0)" (click)="logout()" class="text-danger text-decoration-none d-flex align-items-center" title="Logout" style="cursor: pointer; transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'">
        <i class="bi bi-box-arrow-right fs-3"></i>
      </a>

    </div>
  </div>
</nav>
