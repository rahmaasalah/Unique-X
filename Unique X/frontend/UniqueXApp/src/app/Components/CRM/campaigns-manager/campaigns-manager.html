<div class="container mt-4 mb-5" dir="ltr">
  
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="m-0 fw-bold"><i class="bi bi-megaphone-fill text-danger me-2"></i>Manage Campaigns</h2>
    <button class="btn btn-outline-secondary rounded-pill px-4 fw-bold" (click)="router.navigate(['/crm/leads'])">
      <i class="bi bi-arrow-left me-1"></i> Back to Pipeline
    </button>
  </div>

  <div class="card border-0 shadow-sm rounded-4 p-4 mt-4 border-top border-danger border-4">
    <div class="row g-4">
      
      <!-- إضافة حملة -->
      <div class="col-md-5">
        <div class="bg-light p-4 rounded-4 border">
          <form [formGroup]="campaignForm" (ngSubmit)="onSubmitCampaign()">
            <div class="mb-3">
              <label class="small text-muted fw-bold mb-1">Campaign Name *</label>
              <input type="text" class="form-control bg-white border-0 py-2 shadow-sm" formControlName="name" placeholder="e.g. Summer Offer">
            </div>
            <div class="mb-4">
              <label class="small text-muted fw-bold mb-1">Source *</label>
              <select class="form-select bg-white border-0 py-2 shadow-sm" formControlName="source">
                <option value="Facebook Ads">Facebook Ads</option>
                <option value="Google Ads">Google Ads</option>
                <option value="Instagram">Instagram</option>
                <option value="TikTok">TikTok</option>
                <option value="Property Finder">Property Finder</option>
                <option value="Bayut">Bayut</option>
                <option value="Akar map">Akar map</option>
                <option value="Groups">Groups</option>
                <option value="WhatsApp">WhatsApp</option>
                <option value="Cold Call">Cold Call</option>
                <option value="Referral">Referral</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <!-- 🟢 الزرار بقى أحمر عشان يطابق الديزاين -->
            <button type="submit" class="btn btn-danger w-100 rounded-pill fw-bold shadow-sm" [disabled]="campaignForm.invalid">
              <i class="bi bi-plus-circle me-1"></i> Add Campaign
            </button>
          </form>
        </div>
      </div>

      <!-- جدول الحملات -->
      <div class="col-md-7">
        <div class="table-responsive rounded-3 border">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th class="ps-3 py-3">Campaign Name</th>
                <th>Source</th>
                <th class="text-end pe-3">Action</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let c of campaignsList()">
                <td class="ps-3 fw-bold text-dark">{{ c.name }}</td>
                <td><span class="badge bg-secondary">{{ c.source }}</span></td>
                <td class="text-end pe-3">
                  <button class="btn btn-sm btn-outline-danger rounded-circle" (click)="onDeleteCampaign(c.id)" title="Delete">
                    <i class="bi bi-trash3"></i>
                  </button>
                </td>
              </tr>
              <tr *ngIf="campaignsList().length === 0">
                <td colspan="3" class="text-center text-muted py-4">No campaigns found.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>
