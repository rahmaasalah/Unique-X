server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    client_max_body_size 50M;
    resolver 127.0.0.11 valid=10s;

    # 🟢 ضغط الردود (gzip) - كان متعطل خالص، وده بيقلل حجم نقل الـ JS/CSS/JSON بشكل كبير جدًا
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        font/ttf
        font/otf
        image/svg+xml;

    # متغير بيحدد لو الطلب جاي من بوت معاينة لينكات (واتساب، فيسبوك، تليجرام...)
    set $is_preview_bot 0;
    if ($http_user_agent ~* "WhatsApp|facebookexternalhit|Facebot|Twitterbot|TelegramBot|LinkedInBot|Slackbot|Discordbot|SkypeUriPreview|vkShare|W3C_Validator") {
        set $is_preview_bot 1;
    }

    # لو الطلب لصفحة تفاصيل وحدة ومن بوت معاينة، حوليه لـ endpoint الباك إند اللي بيرجع meta tags صحيحة
    location ~ ^/property-details/(?<prop_id>\d+) {
        if ($is_preview_bot = 1) {
            proxy_pass http://backend:8080/api/propertypreview/$prop_id;
            break;
        }
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # نفس الفكرة بالظبط لصفحة البلوج/المشروع
    location ~ ^/blog/(?<blog_id>\d+) {
        if ($is_preview_bot = 1) {
            proxy_pass http://backend:8080/api/blogpreview/$blog_id;
            break;
        }
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 🟢 كاش سنة كاملة لملفات الـ build المُهاشة (main.[hash].js, styles.[hash].css, الخطوط والصور...)
    # آمن تمامًا لأن Angular بيغيّر اسم الملف نفسه (الهاش) أول ما المحتوى يتغير، فمفيش خطر إن المستخدم ياخد نسخة قديمة
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|ico)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location ~ \.html$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
